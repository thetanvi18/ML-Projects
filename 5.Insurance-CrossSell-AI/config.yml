data: 
  train_path: data/train.csv
  test_path: data/test.csv

train:
  test_size: 0.2
  random_state: 42
  shuffle: true

model:
  name: XGBClassifier
  params:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    scale_pos_weight: 8
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    eval_metric: auc
    use_label_encoder: false
  store_path: models/

